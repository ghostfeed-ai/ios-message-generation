<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>iOS 26 Messages renderer</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      --blue-top: #3c85f8;
      --blue-bottom: #3c85f8;
      --received: #e9e9eb;
      --label: #000;
      --secondary: #747478;
      --keyboard: #d0d3d8;
      --key: rgba(255,255,255,.96);
      --glass: rgba(248,248,250,.72);
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #fff; }
    body { user-select: none; -webkit-font-smoothing: antialiased; }

    #camera {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #fff;
      transform-origin: 50% 58%;
      will-change: transform;
    }

    .status {
      position: absolute;
      inset: 0 0 auto;
      height: 52px;
      z-index: 20;
      color: #050505;
      font-size: 31px;
      font-weight: 650;
      background: linear-gradient(180deg, #f4f4f5 0%, rgba(249,249,250,.94) 100%);
    }
    .status-left {
      position: absolute;
      left: 60px;
      top: 11px;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .silent-icon {
      width: 24.4px;
      height: 26.4px;
      margin-top: 1.5px;
      color: #050505;
    }
    .status-icons {
      position: absolute;
      right: 50px;
      top: 16.5px;
      display: flex;
      align-items: center;
      gap: 12.6px;
    }
    .cell-bars { display: flex; align-items: end; gap: 3.6px; height: 23.4px; }
    .cell-bars i { display: block; width: 6.7px; border-radius: 2px; background: #050505; }
    .cell-bars i:nth-child(1) { height: 9.5px; }
    .cell-bars i:nth-child(2) { height: 13.4px; }
    .cell-bars i:nth-child(3) { height: 18.4px; }
    .cell-bars i:nth-child(4) { height: 23.4px; }
    .wifi-svg {
      width: 32.4px;
      height: 23.7px;
      display: block;
    }
    .battery { display: flex; align-items: center; }
    .battery::after {
      content: "";
      width: 3.1px;
      height: 7.8px;
      margin-left: 1.7px;
      border-radius: 0 3.1px 3.1px 0;
      background: rgba(0,0,0,.34);
    }
    .battery-body {
      position: relative;
      width: 47.7px;
      height: 25.7px;
      border-radius: 7.8px;
      overflow: hidden;
      background: rgba(0,0,0,.34);
      display: grid;
      place-items: center;
    }
    .battery-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: 84%;
      background: #050505;
    }
    .battery-num {
      position: relative;
      color: #fff;
      font-size: 22.2px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: .9px;
      padding-left: .9px;
      margin-left: 1.1px;
    }

    .navigation {
      position: absolute;
      inset: 52px 0 auto;
      height: 131px;
      z-index: 15;
      pointer-events: none;
      border-bottom: 1px solid rgba(60,60,67,.12);
      background: rgba(249,249,250,.88);
      backdrop-filter: blur(28px) saturate(150%);
    }
    .glass-button {
      position: absolute;
      width: 80.5px;
      height: 80.5px;
      top: 25px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #1a1a1a;
      background:
        linear-gradient(155deg, rgba(255,255,255,.99), rgba(248,249,252,.88));
      border: 1px solid rgba(255,255,255,.98);
      box-shadow:
        0 8px 26px rgba(24,34,52,.11),
        inset 0 1px 1px rgba(255,255,255,.98);
      backdrop-filter: blur(22px) saturate(170%);
    }
    .back {
      left: 24px;
      width: auto;
      min-width: 80.5px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 18.9px;
      padding: 0 30.8px 0 24.4px;
    }
    .back:has(> .unread[hidden]) {
      padding: 0;
      gap: 0;
      justify-content: center;
    }
    .back .chev { width: 19.8px; height: 34.2px; margin-top: .8px; }
    .video { right: 24px; }
    .video svg { width: 48.9px; height: 32.4px; }
    .unread[hidden] { display: none; }
    .unread {
      min-width: 34.8px;
      height: 34.8px;
      padding: 0 12.8px;
      border-radius: 17.4px;
      display: grid;
      place-items: center;
      color: #fff;
      background: #19191b;
      font-size: 22px;
      font-weight: 650;
      line-height: 1;
    }
    .contact {
      position: absolute;
      left: 50%;
      top: 4px;
      width: 230px;
      transform: translateX(-50%);
      text-align: center;
    }
    .avatar {
      width: 74px;
      height: 74px;
      margin: 0 auto 4px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      overflow: hidden;
      color: #fff;
      background: #dfe5ec;
      font-size: 38px;
      font-weight: 500;
      border: 1px solid rgba(60,60,67,.10);
      box-shadow:
        0 2px 8px rgba(0,0,0,.08),
        inset 0 0 0 .5px rgba(255,255,255,.7);
      background-position: center;
      background-size: cover;
    }
    .contact-name { font-size: 22px; font-weight: 550; line-height: 1.08; color: #111; }
    .contact-name span { color: #8e8e93; padding-left: 2px; }
    .contact-name #contact-name { color: #111; padding-left: 0; }

    #conversation {
      position: absolute;
      z-index: 2;
      inset: 202px 0 122px;
      overflow: hidden;
      padding: 17px 24px 20px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 3px;
    }
    .day-label {
      color: #8e8e93;
      text-align: center;
      font-size: 20px;
      font-weight: 500;
      margin: 0 auto 12px;
    }
    .message-row {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      transform-origin: 0 100%;
      animation: bubble-pop .22s cubic-bezier(.18,1.28,.44,1) both;
    }
    .message-row.sent {
      align-items: flex-end;
      transform-origin: 100% 100%;
      position: relative;
      right: -4px;
    }
    .message-row.received,
    .message-row.typing {
      position: relative;
      left: 3px;
    }
    /* Christina-style focus view: the full conversation exists, but only the
       current line and the context above it are readable. */
    body.focus-mode #compose-dock,
    body.focus-mode #keyboard,
    body.focus-mode #attachment-menu,
    body.focus-mode #media-scrim,
    body.focus-mode #photo-picker,
    body.focus-mode #camera-flow,
    body.focus-mode #staging-card {
      display: none;
    }
    body.focus-mode #conversation {
      bottom: 30px;
      padding-bottom: 42px;
    }
    body.focus-mode .message-row {
      animation: none;
      transition: filter .16s ease-out, opacity .16s ease-out, transform .16s ease-out;
    }
    body.focus-mode .message-row.focus-future {
      filter: blur(var(--future-message-blur, 9px));
      opacity: .58;
      transform: scale(.986);
      pointer-events: none;
    }
    body.focus-mode .message-row.focus-current,
    body.focus-mode .message-row.focus-past {
      filter: none;
      opacity: 1;
      transform: scale(1);
    }
    body.focus-mode .receipt {
      display: none;
    }
    /* Full-screen progressive reveal: every chat bubble exists from frame one,
       but the unrevealed future stays soft until its spoken line begins. */
    body.progressive-blur-mode #compose-dock,
    body.progressive-blur-mode #keyboard,
    body.progressive-blur-mode #attachment-menu,
    body.progressive-blur-mode #media-scrim,
    body.progressive-blur-mode #photo-picker,
    body.progressive-blur-mode #camera-flow,
    body.progressive-blur-mode #staging-card {
      display: none;
    }
    body.progressive-blur-mode #conversation {
      bottom: 30px;
      padding-bottom: 42px;
    }
    body.progressive-blur-mode .message-row {
      animation: none;
      transition: none;
    }
    body.progressive-blur-mode .message-row.progressive-blur {
      filter: blur(var(--future-message-blur, 12px));
      opacity: .44;
      transform: scale(.985);
      pointer-events: none;
    }
    body.progressive-blur-mode .message-row.progressive-clear {
      filter: none;
      opacity: 1;
      transform: scale(1);
    }
    body.progressive-blur-mode .message-row.progressive-hidden {
      display: none !important;
    }
    body.progressive-blur-mode .receipt {
      display: none;
    }
    /* Compact lyric mode is a centered phone crop, not a full chat history. */
    body.compact-lyric-mode {
      background: #000;
    }
    body.compact-lyric-mode #camera {
      top: 315px;
      right: 18px;
      bottom: auto;
      left: 18px;
      height: 650px;
      border-radius: 36px;
      transform: none !important;
    }
    body.compact-lyric-mode #conversation {
      inset: 184px 0 0;
      display: block;
      overflow: hidden;
      padding: 24px 26px 22px;
    }
    body.compact-lyric-mode .day-label {
      display: none;
    }
    body.compact-lyric-mode .message-row {
      position: absolute;
      left: 26px;
      right: 26px;
      top: 24px;
      width: auto;
      margin: 0;
      transform: none !important;
      transform-origin: 50% 50%;
    }
    body.compact-lyric-mode .message-row.sent {
      align-items: flex-end;
      right: 26px;
    }
    body.compact-lyric-mode .message-row.compact-next {
      filter: blur(var(--future-message-blur, 7px));
      opacity: .5;
      transform: scale(.99) !important;
    }
    body.compact-lyric-mode .message-row.compact-current {
      display: flex !important;
      filter: none;
      opacity: 1;
      transform: none !important;
    }
    body.compact-lyric-mode .message-row.compact-next {
      display: flex !important;
    }
    body.compact-lyric-mode .message-row.compact-hidden {
      display: none !important;
    }
    body.compact-lyric-mode .home-indicator {
      display: none;
    }
    .message-row.grouped { margin-top: 0; }
    .message-row.sent + .message-row.received,
    .message-row.sent + .message-row.typing,
    .message-row.received + .message-row.sent { margin-top: 9px; }
    .bubble {
      position: relative;
      z-index: 1;
      max-width: 500px;
      padding: 13px 28px;
      border-radius: 31px;
      color: var(--label);
      background: transparent;
      font-size: 34px;
      line-height: 1.2;
      letter-spacing: -.62px;
      overflow-wrap: anywhere;
      isolation: isolate;
    }
    .bubble-shape {
      position: absolute;
      z-index: -1;
      top: 0;
      overflow: visible;
      pointer-events: none;
    }
    .sent .bubble {
      color: #fff;
      padding-left: 27px;
      padding-right: 37px;
    }
    .received .bubble,
    .typing .bubble {
      padding-top: 12px;
      padding-bottom: 12px;
      background: transparent;
      overflow: visible;
    }
    .received .bubble {
      padding-left: 23px;
      padding-right: 29px;
    }
    .receipt {
      position: relative;
      top: 7px;
      margin: 5px 8px 0;
      color: #8e8e93;
      font-size: 17px;
      line-height: 1;
    }
    .message-row.media {
      animation: media-pop .28s cubic-bezier(.18,1.18,.38,1) both;
    }
    .media-bubble {
      position: relative;
      line-height: 0;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.08));
    }
    .media-bubble svg {
      display: block;
      overflow: visible;
    }
    .media-bubble image {
      image-rendering: auto;
    }
    .media-placeholder {
      width: 420px;
      height: 310px;
      display: grid;
      place-items: center;
      border-radius: 27px;
      color: #fff;
      background: linear-gradient(145deg,#78a7dd,#355376);
      font-size: 26px;
      line-height: 1;
    }
    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 65px;
      min-width: 116px;
      padding: 0 23px;
    }
    .typing-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: #8e8e93;
      animation: typing-dot 1.15s infinite ease-in-out;
    }
    .typing-dot:nth-child(2) { animation-delay: .14s; }
    .typing-dot:nth-child(3) { animation-delay: .28s; }

    #compose-dock {
      position: absolute;
      z-index: 12;
      left: 20px;
      right: 17px;
      bottom: 48px;
      height: 75px;
      display: grid;
      grid-template-columns: 63px minmax(0,1fr);
      gap: 18px;
      align-items: center;
    }
    .add-button, .composer {
      background: rgba(255,255,255,.96);
      border: 1.5px solid #d1d1d6;
      box-shadow: none;
    }
    .add-button {
      width: 63px;
      height: 63px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #202124;
      border: 0;
      background: #f1f1f3;
      transform: rotate(0);
      will-change: transform, background;
    }
    .add-button svg { width: 32px; height: 32px; display: block; }
    .composer {
      min-height: 69px;
      border-radius: 35px;
      padding: 0 68px 0 24px;
      display: flex;
      align-items: center;
      color: #111;
      font-size: 31px;
      line-height: 1.2;
      position: relative;
    }
    .placeholder { color: #8e8e93; }
    #cursor {
      width: 3px;
      height: 37px;
      margin-left: 2px;
      background: #0a84ff;
      animation: cursor-blink .9s step-end infinite;
    }
    .composer-action {
      position: absolute;
      right: 10px;
      width: 49px;
      height: 49px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #b6b9be;
    }
    .composer-action svg { width: 28px; height: 28px; }
    .composer-action svg.mic-icon { width: 25px; height: 37px; }
    .composer-action.send { color: #fff; background: #0a84ff; }

    #keyboard {
      position: absolute;
      z-index: 11;
      left: 0;
      right: 0;
      bottom: -461px;
      height: 461px;
      padding: 0 3px;
      color: #090909;
      background: rgba(211,214,219,.97);
      border-top: 1px solid rgba(255,255,255,.55);
      border-radius: 0;
      box-shadow: 0 -8px 28px rgba(28,36,52,.08);
      backdrop-filter: blur(30px) saturate(150%);
    }
    .predictions {
      height: 75px;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      align-items: center;
      font-size: 27px;
      text-align: center;
    }
    .prediction { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prediction + .prediction { border-left: 1px solid rgba(100,103,108,.16); }
    .key-row {
      display: grid;
      gap: 7px;
      margin-bottom: 9px;
      justify-content: center;
    }
    .row-10 { grid-template-columns: repeat(10, 1fr); }
    .row-9 { grid-template-columns: repeat(9, 1fr); padding-inline: 32px; }
    .row-7 { grid-template-columns: 67px repeat(7,1fr) 67px; }
    .key {
      position: relative;
      height: 66px;
      min-width: 0;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--key);
      box-shadow:
        0 2px 0 rgba(80,84,91,.28),
        0 1px 2px rgba(70,74,80,.13);
      font-size: 32px;
      font-weight: 400;
      line-height: 1;
    }
    .key.pressed {
      background: #c4c6c9;
      box-shadow:
        inset 0 1px 1px rgba(77,82,90,.10),
        0 1px 0 rgba(80,84,91,.18);
    }
    .key.system { background: #abb0b8; font-size: 28px; }
    .bottom-row {
      display: grid;
      grid-template-columns: 160px 1fr 160px;
      gap: 8px;
    }
    .bottom-row .key { height: 66px; font-size: 25px; }
    .keyboard-footer {
      position: absolute;
      left: 63px;
      right: 63px;
      bottom: 15px;
      height: 45px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .keyboard-emoji {
      width: 42px;
      height: 42px;
    }
    .dictation {
      width: 39px;
      height: 44px;
    }
    .home-indicator {
      position: absolute;
      z-index: 30;
      width: 250px;
      height: 12px;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: #080808;
    }
    #media-scrim {
      position: absolute;
      z-index: 24;
      inset: 223px 0 0;
      pointer-events: none;
      background: rgba(16,20,28,.10);
      opacity: 0;
      will-change: opacity;
    }
    #attachment-menu {
      position: absolute;
      z-index: 26;
      left: 20px;
      bottom: 73px;
      width: 540px;
      height: 820px;
      overflow: hidden;
      padding: 18px 18px;
      border: 1px solid rgba(255,255,255,.92);
      border-radius: 44px;
      background:
        linear-gradient(145deg,rgba(255,255,255,.91),rgba(243,245,248,.78));
      box-shadow:
        0 24px 55px rgba(31,36,45,.22),
        inset 0 1px 1px rgba(255,255,255,.95);
      backdrop-filter: blur(34px) saturate(175%);
      opacity: 0;
      transform: translateY(20px) scale(.88);
      transform-origin: 22px 100%;
      will-change: opacity, transform;
      pointer-events: none;
    }
    .attachment-row {
      height: 120px;
      display: grid;
      grid-template-columns: 76px minmax(0,1fr);
      align-items: center;
      gap: 24px;
      padding: 0 28px;
      border-radius: 29px;
      color: #111;
      font-size: 42px;
      font-weight: 450;
      letter-spacing: -.55px;
    }
    .attachment-row.selected {
      background: rgba(0,122,255,.11);
    }
    .menu-icon {
      width: 68px;
      height: 68px;
      display: block;
      object-fit: contain;
    }
    .menu-icon.circle {
      border-radius: 50%;
      object-fit: cover;
    }
    .menu-icon.cash {
      border-radius: 50%;
      background: #17181a;
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 40px;
      font-weight: 600;
      line-height: 1;
    }
    #photo-picker {
      position: absolute;
      z-index: 25;
      left: 0;
      right: 0;
      bottom: 0;
      height: 567px;
      overflow: hidden;
      padding-top: 18px;
      background: #fff;
      box-shadow: 0 -12px 34px rgba(25,31,42,.07);
      transform: translateY(100%);
      will-change: transform, opacity;
      pointer-events: none;
    }
    #photo-grid-viewport {
      height: 549px;
      overflow: hidden;
    }
    #photo-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      grid-auto-rows: 230px;
      gap: 2px;
      padding: 0 13.5px;
      margin-top: -67px;
    }
    .photo-thumb {
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      background: #e2e3e6;
      background-position: center;
      background-size: cover;
    }
    .photo-badge {
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 45px;
      height: 45px;
      display: none;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: #0a84ff;
      border: 2.5px solid #fff;
      font-size: 24px;
      font-weight: 640;
      line-height: 1;
      box-shadow: 0 2px 8px rgba(0,0,0,.28);
    }
    .photo-thumb.selected .photo-badge { display: grid; }
    .photo-duration {
      position: absolute;
      left: 12px;
      bottom: 9px;
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .2px;
      text-shadow: 0 1px 6px rgba(0,0,0,.55);
    }
    #staging-card {
      position: absolute;
      z-index: 27;
      left: 101px;
      right: 27px;
      bottom: 596px;
      padding: 20px 20px 0;
      border-radius: 34px;
      background: #fff;
      border: 1.5px solid rgba(60,60,67,.08);
      box-shadow: 0 14px 44px rgba(20,26,38,.16);
      opacity: 0;
      visibility: hidden;
      transform: translateY(26px) scale(.96);
      transform-origin: 30% 100%;
      will-change: opacity, transform;
      pointer-events: none;
    }
    .staging-thumb {
      position: relative;
      width: 196px;
      height: 260px;
      border-radius: 14px;
      background-color: #e2e3e6;
      background-position: center;
      background-size: cover;
    }
    .staging-x {
      position: absolute;
      top: 9px;
      right: 9px;
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: rgba(24,24,26,.52);
      backdrop-filter: blur(8px);
    }
    .staging-x svg { width: 19px; height: 19px; }
    .staging-divider {
      height: 1.5px;
      margin: 18px 2px 0;
      background: rgba(60,60,67,.14);
    }
    .staging-row {
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .staging-placeholder {
      color: #8e8e93;
      font-size: 31px;
      padding-left: 6px;
    }
    .staging-send {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: #0a84ff;
    }
    .staging-send svg { width: 32px; height: 32px; }
    #camera-flow {
      position: absolute;
      z-index: 60;
      inset: 0;
      overflow: hidden;
      color: #fff;
      background: #000;
      opacity: 0;

      row.className = `message-row ${event.side}${event.kind === "image" ? " media" : ""}`;
      if (story.messages[event.index - 1]?.side === event.side) row.classList.add("grouped");
      row.dataset.index = String(event.index);
      if (event.kind === "image") {
        row.append(createMediaBubble(event));
      } else {
        const MessageHtml = escapeHtml(event.text).replaceAll("\n", "<br>");
        const BubbleStyle = Number.isFinite(event.bubbleWidth) ? ` style="width:${event.bubbleWidth}px"` : "";
        row.innerHTML = `<div class="bubble"${BubbleStyle}>${MessageHtml}</div>`;
      }
      if (event.side === "sent") {
        const Receipt = document.createElement("div");
        Receipt.className = "receipt";
        Receipt.dataset.receipt = "";
        Receipt.textContent = "Delivered";
        row.append(Receipt);
      }
      conversation.append(row);
      const Bubble = row.querySelector(".bubble");
      if (Bubble) mountBubbleShape(Bubble, event.side);
    };

    const mountTyping = () => {
      if (focusMode || compactLyricMode || progressiveBlurMode) return;
      if (typingNode) return;
      typingNode = document.createElement("div");
      typingNode.className = "message-row typing";
      typingNode.innerHTML = '<div class="bubble"><i class="typing-dot"></i><i class="typing-dot"></i><i class="typing-dot"></i></div>';
      conversation.append(typingNode);
      mountBubbleShape(typingNode.querySelector(".bubble"), "received");
    };

    const removeTyping = () => {
      typingNode?.remove();
      typingNode = null;
    };

    const updateFocusMessages = (elapsed) => {
      if (!focusMode) return;
      const activeEvent = schedule.find(event =>
        elapsed >= event.phaseStart && elapsed < event.reveal
      );
      const latestRevealed = [...schedule]
        .reverse()
        .find(event => elapsed >= event.reveal);
      const focusedIndex = activeEvent?.index ?? latestRevealed?.index ?? 0;
      conversation.querySelectorAll(".message-row[data-index]").forEach(row => {
        const index = Number(row.dataset.index);
        row.classList.toggle("focus-past", index < focusedIndex);
        row.classList.toggle("focus-current", index === focusedIndex);
        row.classList.toggle("focus-future", index > focusedIndex);
      });
      const focusedRow = conversation.querySelector(`.message-row[data-index="${focusedIndex}"]`);
      if (!focusedRow) return;
      const targetScroll = Math.max(
        0,
        focusedRow.offsetTop - (conversation.clientHeight * .35)
      );
      conversation.scrollTop += (targetScroll - conversation.scrollTop) * .2;
    };

    const updateCompactLyricMessages = (elapsed) => {
      if (!compactLyricMode) return;
      const currentEvent = schedule.find(event =>
        elapsed >= event.phaseStart && elapsed < event.reveal + event.holdDuration
      ) ?? (elapsed >= schedule.at(-1)?.phaseStart ? schedule.at(-1) : null);
      const currentIndex = currentEvent?.index;
      conversation.querySelectorAll(".message-row[data-index]").forEach(row => {
        const index = Number(row.dataset.index);
        row.classList.toggle("compact-current", index === currentIndex);
        row.classList.toggle("compact-next", currentIndex !== undefined && index === currentIndex + 1);
        row.classList.toggle("compact-hidden", index !== currentIndex && index !== currentIndex + 1);
      });
      const CurrentRow = conversation.querySelector(`.message-row[data-index="${currentIndex}"]`);
      const NextRow = conversation.querySelector(`.message-row[data-index="${currentIndex + 1}"]`);
      if (CurrentRow) CurrentRow.style.top = "24px";
      if (CurrentRow && NextRow) {
        NextRow.style.top = `${24 + CurrentRow.getBoundingClientRect().height + 30}px`;
      }
    };

    const updateProgressiveBlurMessages = (elapsed) => {
      if (!progressiveBlurMode) return;
      const currentEvent = [...schedule]
        .reverse()
        .find(event => elapsed >= event.phaseStart) ?? schedule[0];
      const currentIndex = currentEvent?.index ?? 0;
      const WindowStart = Math.max(0, currentIndex - 2);
      const WindowEnd = currentIndex + 2;
      const UnblurDuration = story.progressiveUnblurDuration ?? .22;
      conversation.querySelectorAll(".message-row[data-index]").forEach(row => {
        const index = Number(row.dataset.index);
        const Visible = index >= WindowStart && index <= WindowEnd;
        const IsCurrent = index === currentIndex;
        const IsPast = index < currentIndex;
        const Progress = IsCurrent
          ? (UnblurDuration <= 0 ? 1 : clamp01((elapsed - currentEvent.phaseStart) / UnblurDuration))
          : (IsPast ? 1 : 0);
        row.classList.toggle("progressive-hidden", !Visible);
        row.classList.toggle("progressive-clear", IsPast);
        row.classList.toggle("progressive-blur", !IsPast);
        row.style.filter = `blur(${(1 - Progress) * (story.focusMode?.futureBlur ?? 12)}px)`;
        row.style.opacity = String(.44 + (.56 * Progress));
        row.style.transform = `scale(${.985 + (.015 * Progress)})`;
      });
      conversation.scrollTop = 0;
    };

    const updatePredictions = (text) => {
      const word = text.trim().split(/\s+/).at(-1) || "I";
      predictions[0].textContent = word;
      predictions[1].textContent = `"${word}"`;
      predictions[2].textContent = word.length < 3 ? "you" : `${word}s`;
    };

    const renderMediaUi = (elapsed, activeMedia) => {
      attachmentRows.forEach(Row => Row.classList.remove("selected"));
      [...photoGrid.querySelectorAll(".photo-thumb")].forEach(Thumb =>
        Thumb.classList.remove("selected")
      );
      let MenuProgress = 0;
      let PickerProgress = 0;
      let StageProgress = 0;

      if (activeMedia) {
        const Phases = activeMedia.mediaPhases;
        if (elapsed < Phases.menuEnd) {
          const Opening = easeOutCubic(
            (elapsed - activeMedia.phaseStart) / MediaTiming.menuOpen
          );
          const Closing = easeOutCubic(
            (elapsed - (Phases.menuEnd - .18)) / .18
          );
          MenuProgress = Math.min(Opening, 1 - Closing);
          if (elapsed >= Phases.menuEnd - .24) {
            attachmentRows.find(Row =>
              Row.dataset.source === activeMedia.sendVia
            )?.classList.add("selected");
          }
        }

        if (activeMedia.sendVia === "photos" && elapsed >= Phases.sourceStart) {
          const Opening = easeOutCubic(
            (elapsed - Phases.sourceStart) / MediaTiming.photosOpen
          );
          const Closing = easeOutCubic(
            (elapsed - Phases.sendStart) / Math.max(.01, activeMedia.reveal - Phases.sendStart)
          );
          PickerProgress = Math.min(Opening, 1 - Closing);
          const MatchingLibraryIndex = LibraryItems.findIndex(Item =>
            Item.image === activeMedia.image
          );
          const SelectedLibraryIndex = MatchingLibraryIndex >= 0
            ? MatchingLibraryIndex
            : (Number.isInteger(activeMedia.libraryIndex) ? activeMedia.libraryIndex : 0);
          if (elapsed >= Phases.selectStart) {
            photoGrid.querySelector(`[data-photo-index="${SelectedLibraryIndex}"]`)
              ?.classList.add("selected");
          }
          if (Number.isFinite(Phases.stageStart) && elapsed >= Phases.stageStart) {
            const StageOpening = easeOutCubic(
              (elapsed - Phases.stageStart) / .34
            );
            StageProgress = Math.min(StageOpening, 1 - Closing);
            const StagingImage = activeMedia.image ?? activeMedia.thumbnail ?? "";
            stagingThumb.style.backgroundImage = StagingImage ? `url("${StagingImage}")` : "none";
            const Aspect = ImageAspectCache.get(StagingImage) ?? .75;
            stagingThumb.style.width = `${Math.round(Math.min(420, Math.max(150, 260 * Aspect)))}px`;
          }
        }

        if (activeMedia.sendVia === "camera" && elapsed >= Phases.sourceStart) {
          const Opening = easeOutCubic(
            (elapsed - Phases.sourceStart) / MediaTiming.cameraOpen
          );
          const Closing = easeOutCubic(
            (elapsed - Phases.sendStart) / Math.max(.01, activeMedia.reveal - Phases.sendStart)
          );
          const CameraProgress = Math.min(Opening, 1 - Closing);
          cameraFlow.style.visibility = CameraProgress > .001 ? "visible" : "hidden";
          cameraFlow.style.opacity = String(CameraProgress);
          cameraFlow.style.transform = `translateY(${(1 - CameraProgress) * 32}px) scale(${.985 + (.015 * CameraProgress)})`;
          const CameraImage = activeMedia.image ?? activeMedia.thumbnail ?? "";
          const CameraImageCss = CameraImage ? `url("${CameraImage}")` : "none";
          cameraViewfinderImage.style.backgroundImage = CameraImageCss;
          cameraReviewImage.style.backgroundImage = CameraImageCss;
          const LiveFeedProgress = easeOutCubic(
            (elapsed - (Phases.sourceStart + .22)) / .3
          );
          cameraViewfinderImage.style.opacity = String(LiveFeedProgress);
          const SettleProgress = easeOutCubic(
            (elapsed - Phases.sourceReady) / Math.max(.01, MediaTiming.cameraSettle)
          );
          cameraViewfinderImage.style.transform = `scale(${1.065 - (.025 * SettleProgress)})`;
          const IsReview = elapsed >= Phases.reviewStart;
          cameraFlow.classList.toggle("review", IsReview);
          const FlashProgress = clamp01(
            (elapsed - Phases.captureStart) / Math.max(.01, MediaTiming.cameraFlash)
          );
          cameraFlash.style.opacity = elapsed >= Phases.captureStart && elapsed <= Phases.reviewStart
            ? String(.94 * Math.sin(Math.PI * FlashProgress))
            : "0";
        }
      }

      attachmentMenu.style.visibility = MenuProgress > .001 ? "visible" : "hidden";
      attachmentMenu.style.opacity = String(MenuProgress);
      attachmentMenu.style.transform =
        `translateY(${(1 - MenuProgress) * 20}px) scale(${.88 + (.12 * MenuProgress)})`;
      mediaScrim.style.opacity = String(MenuProgress * .72);
      addButton.style.transform = `rotate(${MenuProgress * 45}deg)`;
      addButton.style.background = MenuProgress > .01 ? "#e3e5e9" : "#f1f1f3";

      photoPicker.style.visibility = PickerProgress > .001 ? "visible" : "hidden";
      photoPicker.style.opacity = String(PickerProgress);
      photoPicker.style.transform = `translateY(${(1 - PickerProgress) * 100}%)`;

      stagingCard.style.visibility = StageProgress > .001 ? "visible" : "hidden";
      stagingCard.style.opacity = String(StageProgress);
      stagingCard.style.transform =
        `translateY(${(1 - StageProgress) * 26}px) scale(${.96 + (.04 * StageProgress)})`;
      composerPill.style.opacity = String(1 - StageProgress);

      if (!activeMedia || activeMedia.sendVia !== "camera") {
        cameraFlow.style.visibility = "hidden";
        cameraFlow.style.opacity = "0";
        cameraFlow.style.transform = "translateY(28px) scale(.985)";
        cameraFlow.classList.remove("review");
        cameraFlash.style.opacity = "0";
      }
      return { pickerProgress: PickerProgress, stageProgress: StageProgress };
    };

    const photoFly = document.querySelector("#photo-fly");
    const easeInOutQuint = (Progress) => {
      const Clamped = clamp01(Progress);
      return Clamped < .5
        ? 16 * Clamped ** 5
        : 1 - Math.pow(-2 * Clamped + 2, 5) / 2;
    };
    const lerp = (From, To, Progress) => From + ((To - From) * Progress);
    const updateCameraGenie = (elapsed) => {
      let FlyVisible = false;
      schedule.forEach(event => {
        if (event.kind !== "image" || event.sendVia !== "camera" || !event.mediaPhases) return;
        const Row = conversation.querySelector(`.message-row[data-index="${event.index}"]`);
        if (!Row) return;
        if (elapsed >= event.reveal) {
          Row.style.opacity = "";
          return;
        }
        const Bubble = Row.querySelector(".media-bubble");
        if (!Bubble || elapsed < event.mediaPhases.sendStart) {
          Row.style.opacity = "0";
          return;
        }
        const RawProgress = clamp01(
          (elapsed - event.mediaPhases.sendStart)
          / Math.max(.01, event.reveal - event.mediaPhases.sendStart)
        );
        const Progress = easeInOutQuint(RawProgress);
        const DriftProgress = easeOutCubic(RawProgress);
        const LandingBlend = clamp01((RawProgress - .82) / .18);
        Row.style.opacity = String(LandingBlend);
        const Target = Bubble.getBoundingClientRect();
        const BodyWidth = Number.isFinite(event.mediaWidth) ? event.mediaWidth : 430;
        const BodyLeft = event.side === "received"
          ? Target.right - BodyWidth
          : Target.left;
        const StartRect = { left: 0, top: 117, width: 720, height: 1279 };
        const Left = lerp(StartRect.left, BodyLeft, DriftProgress);
        const Width = lerp(StartRect.width, BodyWidth, DriftProgress);
        const Top = lerp(StartRect.top, Target.top, Progress);
        const Height = lerp(StartRect.height, Target.height, Progress);
        const FlyImage = event.image ?? event.thumbnail ?? "";
        photoFly.style.left = `${Left}px`;
        photoFly.style.top = `${Top}px`;
        photoFly.style.width = `${Width}px`;
        photoFly.style.height = `${Height}px`;
        photoFly.style.borderRadius = `${lerp(0, 30, DriftProgress)}px`;
        photoFly.style.opacity = String(1 - (LandingBlend * .9));
        photoFly.style.backgroundImage = FlyImage ? `url("${FlyImage}")` : "none";
        FlyVisible = true;
      });
      photoFly.style.visibility = FlyVisible ? "visible" : "hidden";
    };
    const ClockChanges = (story.timeChanges ?? [])
      .map(Change => ({
        ...Change,
        phaseStart: schedule[Change.messageIndex]?.phaseStart,
      }))
      .filter(Change => Number.isFinite(Change.phaseStart))
      .sort((Left, Right) => Left.phaseStart - Right.phaseStart);
    const render = (now) => {
      const elapsed = (now - startedAt) / 1000;
      const CurrentClockChange = [...ClockChanges]
        .reverse()
        .find(Change => elapsed >= Change.phaseStart);
      const CurrentStatusTime = CurrentClockChange?.statusTime ?? story.statusTime;
      const CurrentConversationTime = CurrentClockChange?.conversationTime ?? story.conversationTime;
      document.querySelector("#status-time").textContent = CurrentStatusTime;
      document.querySelector("[data-camera-time]").textContent = CurrentStatusTime;
      document.querySelector("#conversation-time").textContent = CurrentConversationTime;
      if (!ClockChanges.length && story.statusTimeAfter && Number.isFinite(story.statusTimeChangeAt)) {
        const LegacyStatusTime =
          elapsed >= story.statusTimeChangeAt ? story.statusTimeAfter : story.statusTime;
        document.querySelector("#status-time").textContent = LegacyStatusTime;
        document.querySelector("[data-camera-time]").textContent = LegacyStatusTime;
      }
      const active = schedule.find(event => elapsed >= event.phaseStart && elapsed < event.reveal);
      if (focusMode || compactLyricMode || progressiveBlurMode) {
        schedule.forEach(mountMessage);
      } else {
        schedule.filter(event => elapsed >= event.reveal).forEach(mountMessage);
        schedule
          .filter(event =>
            event.kind === "image"
            && event.sendVia === "camera"
            && event.mediaPhases
            && elapsed >= event.mediaPhases.sendStart)
          .forEach(mountMessage);
      }
      updateCameraGenie(elapsed);

      const activeText = active?.kind === "text" ? active : null;
      const activeMedia = active?.kind === "image" ? active : null;
      const sentTyping = activeText?.side === "sent";
      const KeyboardTransition = story.keyboardTransition ?? .25;
      const KeyboardLinger = story.keyboardLinger ?? .5;
      const easeKeyboard = (progress) => {
        const ClampedProgress = Math.max(0, Math.min(1, progress));
        return 1 - Math.pow(1 - ClampedProgress, 3);
      };
      const keyboardProgress = (focusMode || compactLyricMode || progressiveBlurMode) ? 0 : schedule
        .filter(event => event.kind === "text" && event.side === "sent")
        .reduce((MaximumProgress, event) => {
          const OpenProgress = easeKeyboard((elapsed - event.phaseStart) / KeyboardTransition);
          const CloseStart = event.reveal + KeyboardLinger;
          const CloseProgress = 1 - easeKeyboard((elapsed - CloseStart) / KeyboardTransition);
          return Math.max(MaximumProgress, Math.min(OpenProgress, CloseProgress));
        }, 0);
      const keyboardVisible = keyboardProgress > .001;
      const { pickerProgress, stageProgress } = (focusMode || compactLyricMode || progressiveBlurMode)
        ? { pickerProgress: 0, stageProgress: 0 }
        : renderMediaUi(elapsed, activeMedia);
      const DockBottom = 48 + Math.max(425 * keyboardProgress, 545 * pickerProgress);
      if (!focusMode && !compactLyricMode && !progressiveBlurMode) {
        conversation.style.bottom = `${DockBottom + 74 + (316 * stageProgress)}px`;
        composeDock.style.bottom = `${DockBottom}px`;
        stagingCard.style.bottom = `${DockBottom + 3}px`;
        keyboard.style.bottom = `${-461 + (461 * keyboardProgress)}px`;
      }
      if (activeText?.side === "received") mountTyping();
      else removeTyping();
      updateTailGrouping();

      if (sentTyping) {
        const progress = Math.max(0, Math.min(1, (elapsed - activeText.phaseStart) / activeText.duration));
        const CharacterPosition = activeText.text.length * progress;
        const ActiveCharacterIndex = Math.floor(CharacterPosition);
        const CharacterPhase = CharacterPosition - ActiveCharacterIndex;
        const TypedCharacterCount = Math.min(
          activeText.text.length,
          Math.floor(CharacterPosition + .38)
        );
        const typed = activeText.text.slice(0, TypedCharacterCount);
        composerCopy.textContent = typed;
        composerCopy.classList.remove("placeholder");
        composerCursor.hidden = false;
        composerAction.classList.add("send");
        composerAction.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 18V6M6.5 11.5 12 6l5.5 5.5"/></svg>';
        updatePredictions(typed);
        updateKeyboardCase(typed.length === 0 && activeText.index === FirstSentTextEvent?.index);
        const ActiveCharacter = activeText.text[ActiveCharacterIndex];
        updatePressedKey(ActiveCharacter, ActiveCharacterIndex < activeText.text.length && CharacterPhase < .66);
      } else {
        composerCopy.textContent = "iMessage";
        composerCopy.classList.add("placeholder");
        composerCursor.hidden = true;
        composerAction.classList.remove("send");
        composerAction.innerHTML = '<svg class="mic-icon" viewBox="0 0 21 31" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="1" width="9" height="16" rx="4.5"/><path d="M1 11.5v1a9.5 9.5 0 0 0 19 0v-1"/><path d="M10.5 22v5.5M4.5 29.5h12"/></svg>';
        predictions[0].textContent = "I";
        predictions[1].textContent = "The";
        predictions[2].textContent = "I'm";
        updateKeyboardCase(elapsed < (FirstSentTextEvent?.phaseStart ?? Infinity));
        updatePressedKey("", false);
      }

      const revealedSentEvents = schedule.filter(event => event.side === "sent" && elapsed >= event.reveal);
      const latestSentEvent = revealedSentEvents.at(-1);
      const FlyingCameraEvent = schedule.find(event =>
        event.kind === "image"
        && event.sendVia === "camera"
        && event.mediaPhases
        && elapsed >= event.mediaPhases.sendStart
        && elapsed < event.reveal);
      const ReceiptEvent = FlyingCameraEvent
        && (!latestSentEvent || FlyingCameraEvent.index > latestSentEvent.index)
        ? FlyingCameraEvent
        : latestSentEvent;
      document.querySelectorAll("[data-receipt]").forEach(receipt => {
        const IsCurrent = receipt.closest(".message-row")?.dataset.index === String(ReceiptEvent?.index);
        receipt.hidden = !IsCurrent;
        if (!IsCurrent) return;
        const AppearProgress = easeOutCubic(
          (elapsed - (ReceiptEvent.reveal + .05)) / .45
        );
        const SwapTime = ReceiptEvent.reveal + (story.deliveredDuration ?? .1);
        const SwapDip = Math.abs(elapsed - SwapTime) < .16
          ? clamp01(Math.abs(elapsed - SwapTime) / .16)
          : 1;
        receipt.style.opacity = String(AppearProgress * SwapDip);
        receipt.style.transform = `translateY(${(1 - AppearProgress) * 6}px)`;
        receipt.textContent = elapsed >= SwapTime ? `Read ${story.readTime}` : "Delivered";
      });

      if (compactLyricMode) updateCompactLyricMessages(elapsed);
      else if (progressiveBlurMode) updateProgressiveBlurMessages(elapsed);
      else if (focusMode) updateFocusMessages(elapsed);
      else conversation.scrollTop = conversation.scrollHeight;
      const latestReveal = [...schedule].reverse().find(event => elapsed >= event.reveal);
      const sinceReveal = latestReveal ? elapsed - latestReveal.reveal : 99;
      const zoomStrength = story.cameraZoom && !keyboardVisible && sinceReveal >= 0 && sinceReveal < .65
        ? 1 - sinceReveal / .65
        : 0;
      const eased = 1 - Math.pow(1 - zoomStrength, 3);
      camera.style.transformOrigin = latestReveal?.side === "sent" ? "68% 66%" : "32% 66%";
      camera.style.transform = `scale(${1 + .02 * eased})`;
      if (forcedTime === null) requestAnimationFrame(render);
    };
    window.__renderAt = (seconds) => render(startedAt + seconds * 1000);
    if (forcedTime === null) requestAnimationFrame(render);
    else window.__renderAt(forcedTime);
  </script>
</body>
</html>

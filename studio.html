<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iMessage Render Studio</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      --panel: #17181c;
      --panel-2: #1f2127;
      --line: #2b2e36;
      --text: #e8e9ec;
      --muted: #8b8f99;
      --accent: #0a84ff;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-columns: 360px 1fr;
      background: #0d0e11;
      color: var(--text);
    }

    #config {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: 1px solid var(--line);
      background: var(--panel);
    }
    #config header {
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--line);
    }
    #config header h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.2px; }
    #config header p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }
    #fields {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 14px 18px 18px;
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      margin-bottom: 5px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .4px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field input[type="text"], .field input[type="number"], .field select, .field textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }
    .field textarea {
      height: 300px;
      resize: vertical;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      line-height: 1.45;
      white-space: pre;
    }
    .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .check input { accent-color: var(--accent); }
    #actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 14px 18px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    button {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel-2);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:active { transform: translateY(1px); }
    #json-status { font-size: 11.5px; min-height: 15px; margin-top: 6px; color: var(--muted); }
    #json-status.bad { color: #ff6b6b; }

    #stage {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
    }
    #viewer {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
      padding: 22px;
      background:
        radial-gradient(1100px 500px at 60% -10%, rgba(50,60,90,.25), transparent),
        #0d0e11;
    }
    #phone-shell {
      position: relative;
      border-radius: 54px;
      padding: 14px;
      background: #1b1d22;
      box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        inset 0 0 0 1.5px #34373f;
    }
    #phone-clip {
      overflow: hidden;
      border-radius: 42px;
      background: #fff;
    }
    #frame-scale { transform-origin: 0 0; }
    #preview {
      width: 720px;
      height: 1560px;
      border: 0;
      display: block;
      background: #fff;
    }
    #transport {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 20px;
      border-top: 1px solid var(--line);
      background: var(--panel);
    }
    #transport button { min-width: 84px; }
    #scrub { flex: 1; accent-color: var(--accent); }
    #clock {
      min-width: 96px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 12.5px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <aside id="config">
    <header>
      <h1>iMessage Render Studio</h1>
      <p>Edit settings, then Apply. Final image: <code>node render-image.mjs --story …</code> · video: <code>node render-video.mjs --story …</code></p>
    </header>
    <div id="fields">
      <div class="field">
        <label for="preset">Story preset</label>
        <select id="preset">
          <option value="story-media.json">story-media.json</option>
          <option value="story-folk.json">story-folk.json</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-contact">Contact name</label>
          <input type="text" id="f-contact" data-key="contactName">
        </div>
        <div class="field">
          <label for="f-time">Status time</label>
          <input type="text" id="f-time" data-key="statusTime">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-battery">Battery %</label>
          <input type="number" id="f-battery" min="0" max="100" data-key="batteryLevel">
        </div>
        <div class="field">
          <label for="f-unread">Unread badge</label>
          <input type="number" id="f-unread" min="0" data-key="unreadCount">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-convtime">Conversation time</label>
          <input type="text" id="f-convtime" data-key="conversationTime">
        </div>
        <div class="field">
          <label for="f-readtime">Read time</label>
          <input type="text" id="f-readtime" data-key="readTime">
        </div>
      </div>
      <div class="field-row">
        <div class="check"><input type="checkbox" id="f-silent" data-key="silentMode"><label for="f-silent" style="margin:0;text-transform:none;font-size:13px;color:var(--text)">Silent mode bell</label></div>
        <div class="field">
          <label for="f-seed">Gallery seed (blank = random)</label>
          <input type="number" id="f-seed" data-key="gallerySeed">
        </div>
      </div>
      <div class="field">
        <label for="story-json">Full story JSON (messages, timings, gallery, sounds — everything)</label>
        <textarea id="story-json" spellcheck="false"></textarea>
        <div id="json-status"></div>
      </div>
    </div>
    <div id="actions">
      <button id="reload-preset">Reload preset</button>
      <button id="apply" class="primary">Apply &amp; Restart</button>
    </div>
  </aside>

  <main id="stage">
    <div id="viewer">
      <div id="phone-shell">
        <div id="phone-clip">
          <div id="frame-scale">
            <iframe id="preview" title="render preview"></iframe>
          </div>
        </div>
      </div>
    </div>
    <div id="transport">
      <button id="play" class="primary">Pause</button>
      <button id="restart">Restart</button>
      <input type="range" id="scrub" min="0" max="10" step="0.01" value="0">
      <span id="clock">0.00 / 0.00s</span>
    </div>
  </main>

  <script>
    let preview = document.querySelector("#preview");
    const frameScale = document.querySelector("#frame-scale");
    const phoneClip = document.querySelector("#phone-clip");
    const jsonBox = document.querySelector("#story-json");
    const jsonStatus = document.querySelector("#json-status");
    const scrub = document.querySelector("#scrub");
    const clock = document.querySelector("#clock");
    const playButton = document.querySelector("#play");
    const presetSelect = document.querySelector("#preset");
    const quickInputs = [...document.querySelectorAll("[data-key]")];

    let currentTime = 0;
    let duration = 0;
    let playing = true;
    let lastTick = null;

    const fitPhone = () => {
      const viewer = document.querySelector("#viewer");
      const available = viewer.getBoundingClientRect();
      const scale = Math.min(
        (available.height - 72) / 1560,
        (available.width - 72) / 720,
        .62
      );
      frameScale.style.transform = `scale(${scale})`;
      phoneClip.style.width = `${720 * scale}px`;
      phoneClip.style.height = `${1560 * scale}px`;
    };
    window.addEventListener("resize", fitPhone);

    const readJson = () => {
      try {
        const parsed = JSON.parse(jsonBox.value);
        jsonStatus.textContent = "JSON OK";
        jsonStatus.classList.remove("bad");
        return parsed;
      } catch (error) {
        jsonStatus.textContent = `Invalid JSON: ${error.message}`;
        jsonStatus.classList.add("bad");
        return null;
      }
    };

    const syncQuickFields = (story) => {
      quickInputs.forEach(input => {
        const value = story[input.dataset.key];
        if (input.type === "checkbox") input.checked = value === true;
        else input.value = value ?? "";
      });
    };

    const collectQuickFields = (story) => {
      quickInputs.forEach(input => {
        const key = input.dataset.key;
        if (input.type === "checkbox") {
          story[key] = input.checked;
        } else if (input.value === "") {
          delete story[key];
        } else if (input.type === "number") {
          story[key] = Number(input.value);
        } else {
          story[key] = input.value;
        }
      });
      return story;
    };

    const loadPreview = async (story) => {
      playing = true;
      playButton.textContent = "Pause";
      currentTime = 0;
      const response = await fetch("index.html", { cache: "no-store" });
      const html = await response.text();
      const freshFrame = document.createElement("iframe");
      freshFrame.id = "preview";
      freshFrame.title = "render preview";
      preview.replaceWith(freshFrame);
      preview = freshFrame;
      const frameWindow = preview.contentWindow;
      frameWindow.__CHAT_STORY__ = story;
      frameWindow.__FORCED_T__ = 0;
      const doc = preview.contentDocument;
      doc.open();
      doc.write(html.replace("<head>", `<head><base href="${location.href.replace(/[^/]*$/, "")}">`));
      doc.close();
      await frameWindow.__assetsReady;
      duration = frameWindow.__renderDuration ?? 10;
      scrub.max = String(duration);
      frameWindow.__renderAt(0);
    };

    const currentStory = () => {
      const parsed = readJson();
      if (!parsed) return null;
      const merged = collectQuickFields(parsed);
      jsonBox.value = JSON.stringify(merged, null, 2);
      return merged;
    };

    const applyAndRestart = () => {
      const story = currentStory();
      if (story) loadPreview(story);
    };

    const loadPreset = async () => {
      const response = await fetch(presetSelect.value, { cache: "no-store" });
      const story = await response.json();
      jsonBox.value = JSON.stringify(story, null, 2);
      syncQuickFields(story);
      jsonStatus.textContent = `Loaded ${presetSelect.value}`;
      jsonStatus.classList.remove("bad");
      await loadPreview(story);
    };

    document.querySelector("#apply").addEventListener("click", applyAndRestart);
    document.querySelector("#restart").addEventListener("click", applyAndRestart);
    document.querySelector("#reload-preset").addEventListener("click", loadPreset);
    presetSelect.addEventListener("change", loadPreset);
    playButton.addEventListener("click", () => {
      playing = !playing;
      playButton.textContent = playing ? "Pause" : "Play";
    });
    scrub.addEventListener("input", () => {
      playing = false;
      playButton.textContent = "Play";
      currentTime = Number(scrub.value);
      preview.contentWindow.__renderAt?.(currentTime);
    });

    const tick = (now) => {
      if (lastTick !== null && playing && duration > 0) {
        currentTime = Math.min(duration, currentTime + (now - lastTick) / 1000);
        if (currentTime >= duration) {
          playing = false;
          playButton.textContent = "Play";
        }
        preview.contentWindow.__renderAt?.(currentTime);
      }
      scrub.value = String(currentTime);
      clock.textContent = `${currentTime.toFixed(2)} / ${duration.toFixed(2)}s`;
      lastTick = now;
      requestAnimationFrame(tick);
    };

    fitPhone();
    loadPreset();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
